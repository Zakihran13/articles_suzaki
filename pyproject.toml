[project]
name = "articles-suzaki"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zakihran13", email = "zakisuzaki13@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.31",
    "httpx>=0.28.1",
    "loguru>=0.8.0",
    "motor>=3.7.1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pydantic-settings>=2.16.3",
    "pymongo>=4.20.2",
    "pytest>=9.2.0",
    "pyyaml>=6.0.4",
    "sqlalchemy[asyncio]>=2.1.9",
]

[project.scripts]
articles-suzaki = "articles_suzaki:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src", "warehouse", "docker", "sql", "tests"]
