services:
  postgres:
    image: postgres:16
    container_name: idx_postgres
    ports:
      - "${POSTGRESQL_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRESQL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRESQL_DB_PASSWORD:?set POSTGRESQL_DB_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRESQL_DB_NAME:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: idx_mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  dagster-webserver:
    image: ghcr.io/dagster-io/dagster:latest
    container_name: idx_dagster_webserver
    command:
      - dagster-webserver
      - -h
      - 0.0.0.0
      - -p
      - "3010"
      - -w
      - workspace.yaml
    ports:
      - "3010:3010"
    volumes:
      - .:/opt/dagster/app
    working_dir: /opt/dagster/app
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  dagster-daemon:
    image: ghcr.io/dagster-io/dagster:latest
    container_name: idx_dagster_daemon
    command:
      - dagster-daemon
      - run
    volumes:
      - .:/opt/dagster/app
    working_dir: /opt/dagster/app
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
    depends_on:
      dagster-webserver:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data: